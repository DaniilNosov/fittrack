{% extends "base.html" %}
{% block title %}- Delete Workout{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-danger">
            <div class="card-body p-4 text-center">
                <h2 class="text-danger mb-3">Delete Workout</h2>
                <p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger">Yes, delete</button>
                        <a href="{% url 'workouts:workout-list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
